baseURL = 'https://chenzhao.github.io/'
title = 'My Cyber Archive'
theme = "paper"
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'


[params]
  mainSections = ['articles' ]
  disablePostNavigation = true              # disable post navigation
  math = true                               # enable KaTeX math typesetting globally

[languages]
  [languages.zh]
    languageCode = 'zh-CN'
    languageName = '中文'
    weight = 1
    title = '我的赛博存档'
    [languages.zh.params]
      description = '研究、思考与日常生活的痕迹。'
    [[languages.zh.menus.main]]
      name = '文章'
      pageRef = '/articles'
      weight = 10
    [[languages.zh.menus.main]]
      name = '关于'
      pageRef = '/'
      weight = 30

  [languages.en]
    languageCode = 'en-US'
    languageName = 'EN'
    weight = 2
    title = 'My Cyber Archive'
    [languages.en.params]
      description = 'Traces of Research, Thought, and Everyday Life.'
    [[languages.en.menus.main]]
      name = 'Articles'
      pageRef = '/articles'
      weight = 10
    [[languages.en.menus.main]]
      name = 'About'
      pageRef = '/'
      weight = 30
