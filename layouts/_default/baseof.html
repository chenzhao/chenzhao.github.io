<!doctype html>

<html
  class="not-ready lg:text-base"
  style="--bg: #faf8f1"
  lang="{{- or site.LanguageCode site.Language.Lang -}}"
  dir="{{- if site.Params.direction -}}{{- site.Params.direction -}}{{- else -}}ltr{{- end -}}"
>
  {{- partial "head.html" . -}}
  <body
    class="bg-(--bg) text-black antialiased duration-200 ease-out [-webkit-tap-highlight-color:transparent]"
  >
    {{- partial "header.html" . -}}

    <main
      class="prose prose-neutral relative mx-auto min-h-[calc(100vh-9rem)] max-w-(--w) px-8 pt-14 pb-16"
    >
      {{- block "main" . -}}{{- end -}}
    </main>

    {{- partial "footer.html" . -}}
  </body>
</html>
